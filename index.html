<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mordle - Modded Wordle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- IN-SITE NOTIFICATION BANNER CONTAINER -->
    <div id="toast-container"></div>

    <!-- MAIN MENU LAYER -->
    <div id="main-menu" class="menu-container">
        <!-- GRAPHIC GAME TILED TITLE -->
        <h1 class="menu-title">
            <span class="title-tile correct">M</span>
            <span class="title-tile present">O</span>
            <span class="title-tile absent">R</span>
            <span class="title-tile correct">D</span>
            <span class="title-tile present">L</span>
            <span class="title-tile absent">E</span>
        </h1>
        <p class="menu-subtitle">The Modded Wordle Clone</p>
        
        <div class="menu-buttons">
            <button class="menu-btn" id="btn-daily">Play Daily</button>
            <button class="menu-btn" id="btn-random">Play Random</button>
            <button class="menu-btn" id="btn-modded">Play Modded</button>
            <button class="menu-btn" id="btn-stats">Stats</button>
            <button class="menu-btn" id="btn-settings">Settings</button>
        </div>
    </div>

    <!-- STATS MODAL/SCREEN -->
    <div id="stats-screen" class="menu-container hidden">
        <h2>YOUR STATISTICS</h2>
        <div class="stats-grid">
            <div class="stat-box"><span id="stat-played">0</span><p>Played</p></div>
            <div class="stat-box"><span id="stat-win-pct">0%</span><p>Win %</p></div>
            <div class="stat-box"><span id="stat-streak">0</span><p>Current Streak</p></div>
            <div class="stat-box"><span id="stat-max-streak">0</span><p>Max Streak</p></div>
        </div>
        <button class="menu-btn back-btn">Main Menu</button>
    </div>

    <!-- SETTINGS MODAL/SCREEN -->
    <div id="settings-screen" class="menu-container hidden">
        <h2>SETTINGS</h2>
        <p style="color: #818384; margin-bottom: 20px;">Manage your local gameplay preferences below.</p>
        <div class="setting-row">
            <button id="btn-reset-data" class="danger-btn">Reset All Stats</button>
        </div>
        <button class="menu-btn back-btn">Main Menu</button>
    </div>

    <!-- MODDED SCREEN INTERFACE CONTAINER -->
    <div id="modded-screen" class="menu-container hidden">
        <h2>MODDED MODES</h2>
        <p style="color: #818384; margin: 15px 0 30px 0;">Exciting custom rules and hazards coming soon!</p>
        <button class="menu-btn back-btn">Main Menu</button>
    </div>

    <!-- MAIN GAME CONTAINER -->
    <div class="game-container hidden" id="active-game">
        <header>
            <div class="header-left"><button id="btn-home">🏠 Menu</button></div>
            <h1 id="game-mode-title">WORDLE CLONE</h1>
            <div class="header-right"></div>
        </header>

        <div id="board-container"></div>

        <div id="keyboard-container">
            <!-- Row 1 -->
            <div class="keyboard-row">
                <button class="key" data-key="q">Q</button>
                <button class="key" data-key="w">W</button>
                <button class="key" data-key="e">E</button>
                <button class="key" data-key="r">R</button>
                <button class="key" data-key="t">T</button>
                <button class="key" data-key="y">Y</button>
                <button class="key" data-key="u">U</button>
                <button class="key" data-key="i">I</button>
                <button class="key" data-key="o">O</button>
                <button class="key" data-key="p">P</button>
            </div>
            <!-- Row 2 -->
            <div class="keyboard-row">
                <button class="key" data-key="a">A</button>
                <button class="key" data-key="s">S</button>
                <button class="key" data-key="d">D</button>
                <button class="key" data-key="f">F</button>
                <button class="key" data-key="g">G</button>
                <button class="key" data-key="h">H</button>
                <button class="key" data-key="j">J</button>
                <button class="key" data-key="k">K</button>
                <button class="key" data-key="l">L</button>
            </div>
            <!-- Row 3 -->
            <div class="keyboard-row">
                <button class="key key-wide" data-key="Enter">ENTER</button>
                <button class="key" data-key="z">Z</button>
                <button class="key" data-key="x">X</button>
                <button class="key" data-key="c">C</button>
                <button class="key" data-key="v">V</button>
                <button class="key" data-key="b">B</button>
                <button class="key" data-key="n">N</button>
                <button class="key" data-key="m">M</button>
                <button class="key key-wide" data-key="Backspace">⌫</button>
            </div>
        </div>
    </div>

    <!-- Modular Script Architecture Elements -->
    <script type="module" src="words.js"></script>
    <script type="module" src="stats.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
